<svg xmlns="http://www.w3.org/2000/svg" width="780" height="316" viewBox="0 0 780 316" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2d7a6b"/>
      <stop offset="100%" stop-color="#4ec9b0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ec9b0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4ec9b0" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#4ec9b0" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="panel">
      <rect x="1" y="1" width="778" height="314" rx="10"/>
    </clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="779" height="315" rx="10" fill="#0d1117" stroke="#30363d"/>

  <g clip-path="url(#panel)">
    <rect x="-260" y="1" width="260" height="314" fill="url(#sweep)">
      <animate attributeName="x" from="-260" to="780" dur="6s" begin="1.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="26" y="36" fill="#e6edf3" font-size="15">Skill levels, measured honestly</text>
  <text x="754" y="36" fill="#6e7681" font-size="11" text-anchor="end">433.92 MHz · self-taught</text>
  <line x1="26" y1="50" x2="754" y2="50" stroke="#21262d"/>

  <g stroke="#1c2128">
    <line x1="230" y1="58" x2="230" y2="296"/>
    <line x1="355" y1="58" x2="355" y2="296"/>
    <line x1="480" y1="58" x2="480" y2="296"/>
    <line x1="605" y1="58" x2="605" y2="296"/>
  </g>

  <g font-size="13">
    <text x="26" y="82" fill="#c9d1d9">Python</text>
    <rect x="230" y="70" width="500" height="14" rx="7" fill="#161b22"/>
    <rect x="230" y="70" width="0" height="14" rx="7" fill="url(#bar)">
      <animate attributeName="width" from="0" to="350" dur="1.1s" begin="0.2s" fill="freeze"/>
    </rect>
    <text x="754" y="82" fill="#4ec9b0" font-size="11" text-anchor="end">70</text>

    <text x="26" y="120" fill="#c9d1d9">HTML &amp; a little CSS</text>
    <rect x="230" y="108" width="500" height="14" rx="7" fill="#161b22"/>
    <rect x="230" y="108" width="0" height="14" rx="7" fill="url(#bar)">
      <animate attributeName="width" from="0" to="125" dur="1.1s" begin="0.35s" fill="freeze"/>
    </rect>
    <text x="754" y="120" fill="#4ec9b0" font-size="11" text-anchor="end">25</text>

    <text x="26" y="158" fill="#c9d1d9">Arduino / C++</text>
    <rect x="230" y="146" width="500" height="14" rx="7" fill="#161b22"/>
    <rect x="230" y="146" width="0" height="14" rx="7" fill="url(#bar)">
      <animate attributeName="width" from="0" to="75" dur="1.1s" begin="0.5s" fill="freeze"/>
    </rect>
    <text x="754" y="158" fill="#4ec9b0" font-size="11" text-anchor="end">15</text>

    <text x="26" y="196" fill="#c9d1d9">Bash &amp; Linux</text>
    <rect x="230" y="184" width="500" height="14" rx="7" fill="#161b22"/>
    <rect x="230" y="184" width="0" height="14" rx="7" fill="url(#bar)">
      <animate attributeName="width" from="0" to="50" dur="1.1s" begin="0.65s" fill="freeze"/>
    </rect>
    <text x="754" y="196" fill="#4ec9b0" font-size="11" text-anchor="end">10</text>

    <text x="26" y="234" fill="#c9d1d9">JavaScript</text>
    <rect x="230" y="222" width="500" height="14" rx="7" fill="#161b22"/>
    <rect x="230" y="222" width="0" height="14" rx="7" fill="url(#bar)">
      <animate attributeName="width" from="0" to="25" dur="1.1s" begin="0.8s" fill="freeze"/>
    </rect>
    <text x="754" y="234" fill="#4ec9b0" font-size="11" text-anchor="end">5</text>

    <line x1="26" y1="256" x2="754" y2="256" stroke="#21262d"/>

    <text x="26" y="286" fill="#e3b341">Reading error messages</text>
    <rect x="230" y="274" width="500" height="14" rx="7" fill="#161b22"/>
    <rect x="230" y="274" width="0" height="14" rx="7" fill="#e3b341">
      <animate attributeName="width" from="0" to="495" dur="2.4s" begin="1.2s" fill="freeze"/>
    </rect>
    <text x="754" y="286" fill="#e3b341" font-size="11" text-anchor="end">99</text>
  </g>
</svg>
